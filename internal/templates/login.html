<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ Title }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />
    <link rel="stylesheet" href="/assets/css/style.css" />
  </head>
  <body class="min-h-screen login-bg flex items-center justify-center p-4">
    <div class="w-full max-w-md animate-fade-in">
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-br from-blue-600 to-pink-500 shadow-lg mb-4">
          <i class="fas fa-water text-white text-2xl"></i>
        </div>
        <h1 class="text-3xl font-extrabold text-slate-800">DIY Camera</h1>
        <p class="text-slate-500 mt-1 text-sm">Fish Detection &amp; Geo-Mapping Platform</p>
      </div>

      <div class="bg-white rounded-2xl shadow-xl p-8 border border-slate-100">
        <h2 class="text-xl font-semibold text-slate-700 mb-6">Sign in to your account</h2>

        {% if Success %}
          <div class="mb-5 flex items-center gap-2 bg-emerald-50 border border-emerald-200 text-emerald-700 text-sm rounded-lg px-4 py-3">
            <i class="fas fa-check-circle"></i>
            <span>{{ Success }}</span>
          </div>
        {% endif %}

        {% if Error %}
          <div class="mb-5 flex items-center gap-2 bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg px-4 py-3">
            <i class="fas fa-exclamation-circle"></i>
            <span>{{ Error }}</span>
          </div>
        {% endif %}

        <form method="POST" action="/auth/login" class="space-y-5">
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1.5">Email address</label>
            <div class="relative">
              <i class="fas fa-envelope absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
              <input type="email" name="email" required class="w-full pl-9 pr-4 py-2.5 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition" placeholder="you@example.com" />
            </div>
          </div>

          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1.5">Password</label>
            <div class="relative">
              <i class="fas fa-lock absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
              <input type="password" name="password" required class="w-full pl-9 pr-4 py-2.5 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition" placeholder="••••••••" />
            </div>
          </div>

          <button type="submit" class="w-full py-2.5 px-4 bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-700 hover:to-blue-800 text-white font-semibold rounded-lg text-sm transition-all duration-200 shadow-md hover:shadow-lg active:scale-95"><i class="fas fa-sign-in-alt mr-2"></i>Sign In</button>
        </form>
      </div>

      <p class="text-center text-sm text-slate-500 mt-4">
        Don't have an account?
        <a href="/register" class="text-blue-600 hover:text-blue-700 font-medium">Create one</a>
      </p>
      <p class="text-center text-xs text-slate-400 mt-3">DIY Camera &copy; 2026 &mdash; JKUAT</p>
    </div>
  </body>
</html>
